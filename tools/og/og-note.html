<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { background: #1f1812; position: relative; overflow: hidden; color: #f3ece2;
         font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', Georgia, 'Liberation Serif', serif; }
  .card { position: absolute; inset: 0; padding: 72px 84px; display: flex; flex-direction: column; justify-content: space-between; }
  .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Liberation Sans', Arial, sans-serif; color: #e8cf9f; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0; }
  .title { font-size: 64px; line-height: 1.12; margin: 24px 0 0; max-width: 1000px; text-wrap: balance; }
  .foot { display: flex; align-items: center; gap: 22px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Liberation Sans', Arial, sans-serif; color: #c3b6a5; font-size: 22px; }
  .foot img { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #e8cf9f; }
  .foot b { color: #f3ece2; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; font-size: 20px; }
  .foot span { color: #8f8272; }
</style></head>
<body>
  <div class="card">
    <div><p class="tag" id="tag"></p><p class="title" id="title"></p></div>
    <div class="foot"><img src="../../public/images/johnny-knoblauch.jpg" alt=""><b>Johnny KNOBLAUCH</b><span>·</span>johnny.knoblauch.fr</div>
  </div>
</body></html>
